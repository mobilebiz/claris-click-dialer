<!DOCTYPE html>
<html">
<head>
  <meta http-equiv="Content-Type" content="application/xhtml+xml; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <!-- ******* Load vonageClientSDK from a CDN ****** -->
  <script src="https://cdn.jsdelivr.net/npm/@vonage/client-sdk@latest/dist/vonageClientSDK.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        spacing: {
          '1': '8px',
          '2': '12px'
        }
      }
    }
  </script>
  <script type="text/javascript">
    let phone = '';
    let btnCall;
    let btnHangup;
    let currentCall;
    let operatorName = 'Operator';  // オペレーター名
    const client = new vonageClientSDK.VonageClient();
    const ringtone = new Audio('./ringtone.mp3'); // 着信音のファイルパスを指定
    ringtone.loop = true; // 着信音をループ再生   
      
    // 初回ユーザーインタラクションで音声を有効化
    function enableAudio() {
      ringtone.play().then(() => {
        ringtone.pause();
        ringtone.currentTime = 0;
        console.log('🐞 Audio enabled');
        // 一度有効化したらイベントリスナーを削除
        document.removeEventListener('click', enableAudio);
        document.removeEventListener('touchstart', enableAudio);
      }).catch(err => {
        console.log('🐞 Audio enable failed:', err);
      });
    }

    // ページのロードが完了したとき
    window.onload = async () => {
      btnCall = document.getElementById('btnCall');
      btnInvite = document.getElementById('btnInvite');
      btnHangup = document.getElementById('btnHangup');
      
      // モバイルデバイスの音声有効化のためのイベントリスナー
      document.addEventListener('click', enableAudio, { once: true });
      document.addEventListener('touchstart', enableAudio, { once: true });
      
      try {
        // JWTの取得
        const response = await fetch(`./getToken?name=${operatorName}`);
        const data = await response.json();
        const jwt = data.jwt;
  
        // セッションの作成
        client.createSession(jwt)
          .then(sessionId => {
            console.log("🐞 Session created.");
          }).catch(error => {
            throw error;
          });

        // コールステータスのイベントリスナー
        client.on('legStatusUpdate', (callId, legId, status) => {
          console.log(`🐞 Leg status update: ${status}`);
          if (status === 'RINGING') { // 呼び出し中
            btnCall.hidden = true;
            btnHangup.innerHTML = '呼び出し中...';
            btnHangup.hidden = false;
          }
          if (status === 'ANSWERED') {  // 相手が応答した
            btnHangup.innerHTML = '切断';
          }
          if (status === 'COMPLETED') { // 通話が終了
            btnCall.disabled = false;
            btnCall.innerHTML = '発信';
            btnCall.hidden = false;
            btnHangup.hidden = true;
            btnHangup.innerHTML = '切断';
          }
        });

        // 通話が切断されたときのイベントリスナー
        client.on('callHangup', (callId, callQuality, reason) => {
          console.log('🐞 Call ended');
          btnCall.disabled = false;
          btnCall.innerHTML = '発信';
          btnCall.hidden = false;
          btnHangup.hidden = true;
          btnHangup.innerHTML = '切断';
        });

        // 着信したときのイベントリスナー
        client.on('callInvite', (callId) => {
          console.log(`🐞 Incoming call.`)
          currentCall = callId;
          btnCall.disabled = true;
          btnCall.hidden = true;
          btnInvite.disabled = false;
          btnInvite.hidden = false;
          
          // 着信音を再生（エラーをキャッチ）
          ringtone.play().catch(err => {
            console.log('🐞 Ringtone play failed:', err);
            // バイブレーションで通知（対応デバイスのみ）
            if ('vibrate' in navigator) {
              navigator.vibrate([200, 100, 200, 100, 200]);
            }
          });
        });
        
        // クエリーパラメータを取得
        console.log(`🐞 Get query parameters`)
        let params = new URLSearchParams(decodeURI(location.search))
        params.forEach((value, key) => {
          if (key === 'number') {
            // phoneの先頭が0の場合は、81に変換
            phone = value.startsWith('0') ? '81' + value.slice(1) : value;
          }
        })
        console.log(`🐞 ${phone}`);

      } catch (error) {
        console.error(`🐞 Error: ${error.message}`)                  
      }
    }

    async function phoneCall() {
      try {
        btnCall.disabled = true;
        btnCall.innerHTML = '準備中...';

        // 電話番号を指定して発信
        client.serverCall({ to: phone }).then((callId) => {
          console.log('🐞 Calling ...');
          btnCall.innerHTML = '発信中...';
          currentCall = callId;
        }).catch((error) => {
          throw error;
        });

      } catch (error) {
        btnCall.disabled = false;
        btnCall.innerHTML = '発信';
        console.error(`🐞 Error: ${error.message}`)        
      }
    }

		async function invite() {
      try {
        btnInvite.disabled = true;
        ringtone.pause();  // 着信音を停止
        ringtone.currentTime = 0; // 再生位置をリセット
        client.answer(currentCall).then(() => {
          console.log('Call answered');
          btnInvite.hidden = true;
          btnHangup.hidden = false;
          btnHangup.disabled = false;
        }).catch((error) => {
          throw error;
        });
      } catch (error) {
        btnInvite.disabled = false;
        btnInvite.hidden = true;
        console.error(`🐞 Error: ${error.message}`)        
      }
    }

		async function hangup() {
      try {
        btnHangup.disabled = true;
        btnHangup.innerHTML = '切断中...';
        client.hangup(currentCall).then(() => {
          console.log('Call ended');
          btnCall.hidden = false;
          btnHangup.hidden = true;
          btnHangup.disabled = false;
        }).catch((error) => {
          throw error;
        });
      } catch (error) {
        btnHangup.disabled = false;
        btnHangup.innerHTML = '切断';
        btnHangup.hidden = false;
        console.error(`🐞 Error: ${error.message}`)        
      }
    }
  </script>
</head>
<body class="center">
  <div class="flex items-center justify-center min-h-screen p-4">
    <div class="w-full max-w-md">
      <button id="btnCall" class="w-full text-white text-lg font-bold bg-blue-500 hover:bg-blue-600 py-4 px-6 rounded-lg shadow-lg transition-colors" onclick="phoneCall()">発信</button>
      <button id="btnInvite" class="w-full text-white text-lg font-bold bg-red-500 hover:bg-red-600 py-4 px-6 rounded-lg shadow-lg animate-pulse transition-colors" hidden onclick="invite()">着信中...</button>
      <button id="btnHangup" class="w-full text-white text-lg font-bold bg-red-500 hover:bg-red-600 py-4 px-6 rounded-lg shadow-lg transition-colors" hidden onclick="hangup()">切断</button>
    </div>
  </div>
</body>
</html>
